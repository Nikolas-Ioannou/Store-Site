<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Favorites | Bluehaven Store</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="index.html" aria-label="Bluehaven Store home">
          <span class="brand-mark">B</span>
          <span class="brand-copy">
            <strong>Bluehaven</strong>
            <small>Tech and Books Marketplace</small>
          </span>
        </a>

        <div class="header-search">
          <form class="header-search-form" action="index.html#product-browser" role="search">
            <span class="header-search-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false">
                <circle cx="11" cy="11" r="6.5"></circle>
                <path d="M16 16L21 21"></path>
              </svg>
            </span>
            <input
              class="header-search-input"
              name="search"
              type="search"
              placeholder="Search products, brands, books"
              aria-label="Search products"
            />
          </form>
        </div>

        <nav class="header-shortcuts" aria-label="Quick links">
          <a class="header-icon-link" data-favorites-link="true" href="profile.html#favorites-card" aria-label="Go to favorites section">
            <img class="shortcut-icon shortcut-icon-heart" src="Photos/heart.png" alt="" />
          </a>
          <a class="header-icon-link" href="profile.html" aria-label="Go to profile page">
            <img class="shortcut-icon shortcut-icon-profile" src="Photos/user.png" alt="" />
          </a>
          <a class="header-icon-link" href="basket.html" aria-label="Go to basket page">
            <img class="shortcut-icon shortcut-icon-basket" src="Photos/shopping-cart.png" alt="" />
          </a>
        </nav>
      </div>
    </header>

    <main class="standalone-page favorites-page-shell">
      <section class="favorites-page-layout">
        <article class="favorites-page-hero">
          <img src="Photos/heart.png" alt="" />
          <div class="page-copy">
            <p class="eyebrow">Favorites</p>
            <h1>Your saved products</h1>
            <p id="favorites-page-copy">Review the products you have saved for later.</p>
          </div>
          <div class="favorites-page-actions">
            <a class="button button-primary" href="index.html">Back to store</a>
            <a class="button button-secondary" href="profile.html#favorites-card">Open profile favorites</a>
          </div>
        </article>

        <section class="account-orders favorites-page-panel">
          <div class="split-heading account-orders-head">
            <div>
              <p class="eyebrow">Saved list</p>
              <h3>Favorite products</h3>
            </div>
            <p class="account-empty" id="favorites-count">0 saved</p>
          </div>
          <div class="account-orders-list" id="favorites-products-list">
            <p class="account-empty">Loading favorites</p>
          </div>
        </section>
      </section>
    </main>

    <script src="site.js"></script>
    <script src="favorites.js"></script>
  </body>
</html>

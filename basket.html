<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Basket | Bluehaven Store</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="index.html" aria-label="Bluehaven Store home">
          <span class="brand-mark">B</span>
          <span class="brand-copy">
            <strong>Bluehaven</strong>
            <small>Tech and Books Marketplace</small>
          </span>
        </a>

        <div class="header-search">
          <form class="header-search-form" action="index.html#product-browser" role="search">
            <span class="header-search-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false">
                <circle cx="11" cy="11" r="6.5"></circle>
                <path d="M16 16L21 21"></path>
              </svg>
            </span>
            <input
              class="header-search-input"
              name="search"
              type="search"
              placeholder="Search products, brands, books"
              aria-label="Search products"
            />
          </form>
        </div>

        <nav class="header-shortcuts" aria-label="Quick links">
          <a class="header-icon-link" data-favorites-link="true" href="profile.html#favorites-card" aria-label="Go to favorites section">
            <img class="shortcut-icon shortcut-icon-heart" src="Photos/heart.png" alt="" />
          </a>
          <a class="header-icon-link" href="profile.html" aria-label="Go to profile page">
            <img class="shortcut-icon shortcut-icon-profile" src="Photos/user.png" alt="" />
          </a>
          <a class="header-icon-link" href="basket.html" aria-label="Go to basket page">
            <img class="shortcut-icon shortcut-icon-basket" src="Photos/shopping-cart.png" alt="" />
          </a>
        </nav>
      </div>
    </header>

    <main class="standalone-page">
      <section class="standalone-card">
        <img src="Photos/shopping-cart.png" alt="" />
        <h1>Your Basket</h1>
        <p>This page can hold cart items, totals, and checkout actions.</p>
        <a class="button button-primary" href="index.html">Back to store</a>
      </section>
    </main>
    <script src="site.js"></script>
  </body>
</html>
